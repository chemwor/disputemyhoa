<script>
// Inline blog list initialization with fallback
(function() {
  // Use relative path for Vite proxy during development, or full URL in production
  var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  var API_BASE_URL = isLocalhost ? '' : 'https://dmhoa-246713e0bd92.herokuapp.com';
  const DEFAULT_IMAGE = './images/ns-img-443.png';

  function formatDate(dateString) {
    const date = new Date(dateString);
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    return day + '.' + month + '.' + year;
  }

  function createBlogCard(post, index) {
    const delay = 0.2 + (index % 2) * 0.2;
    const imageUrl = post.image_url || DEFAULT_IMAGE;
    const category = post.category || 'HOA News';
    const categoryDisplay = category.replace(/-/g, ' ').replace(/\b\w/g, function(l) { return l.toUpperCase(); });
    const datetime = new Date(post.published_at).toISOString().split('T')[0];

    return '<article data-ns-animate data-delay="' + delay + '" class="group">' +
      '<div class="bg-background-1 dark:bg-background-5 rounded-[20px] overflow-hidden relative scale-100 hover:scale-[102%] transition-transform duration-500">' +
        '<figure class="xl:min-h-[310px] xl:max-h-[310px] rounded-b-[20px] overflow-hidden max-w-full">' +
          '<img src="' + imageUrl + '" alt="' + (post.image_alt || post.title) + '" loading="lazy" class="w-full h-full object-cover object-center" />' +
        '</figure>' +
        '<div class="p-4 md:p-6 lg:p-8 space-y-4 rounded-b-[20px]">' +
          '<span class="badge badge-cyan">' + categoryDisplay + '</span>' +
          '<div class="flex items-center gap-4">' +
            '<time class="text-tagline-2 font-medium text-secondary/60 dark:text-accent/60" datetime="' + datetime + '">' + formatDate(post.published_at) + '</time>' +
            '<div class="w-px inline-block h-3 bg-stroke-2 dark:bg-stroke-6"></div>' +
            '<time class="text-tagline-2 font-medium text-secondary/60 dark:text-accent/60">' + (post.read_time_minutes || 5) + ' min</time>' +
          '</div>' +
          '<h3 class="font-normal sm:text-heading-5 text-tagline-1 line-clamp-2">' +
            '<a href="./blog/post.html?slug=' + post.slug + '">' + post.title + '</a>' +
          '</h3>' +
          '<p class="text-tagline-2 font-normal text-secondary/60 dark:text-accent/60 line-clamp-2">' + (post.excerpt || '') + '</p>' +
          '<div class="mt-8">' +
            '<a href="./blog/post.html?slug=' + post.slug + '" class="group/btn-v2 flex items-center gap-x-2 transition-colors duration-500 btn-md-v2 btn-v2-white hover:btn-primary-v2 text-tagline-1">' +
              '<span>Read now</span>' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M7.3125 4.5L11.8125 9L7.3125 13.5" class="stroke-secondary dark:stroke-accent group-hover/btn-v2:stroke-accent" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>' +
            '</a>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  function loadBlogPosts() {
    var container = document.getElementById('blog-posts-container');
    if (!container) {
      console.error('Blog container not found');
      return;
    }

    console.log('Loading blog posts...');

    fetch(API_BASE_URL + '/api/blog-posts?limit=10&offset=0')
      .then(function(response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(function(data) {
        console.log('Blog API response:', data);
        if (!data.posts || data.posts.length === 0) {
          container.innerHTML = '<p class="col-span-full text-center py-12 text-secondary/60">No blog posts found.</p>';
          return;
        }

        var html = data.posts.map(function(post, index) {
          return createBlogCard(post, index);
        }).join('');

        container.innerHTML = html;
        console.log('Blog posts rendered: ' + data.posts.length);
      })
      .catch(function(error) {
        console.error('Error loading blog posts:', error);
        container.innerHTML = '<p class="col-span-full text-center py-12 text-secondary/60">Failed to load blog posts. <button onclick="loadBlogPosts()" class="underline">Try again</button></p>';
      });
  }

  // Make loadBlogPosts available globally
  window.loadBlogPosts = loadBlogPosts;

  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadBlogPosts);
  } else {
    loadBlogPosts();
  }
})();
</script>
