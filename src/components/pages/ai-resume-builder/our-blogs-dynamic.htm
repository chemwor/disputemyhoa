<script>
// Inline blog list initialization with fallback
(function() {
  // Use relative path for Vite proxy during development, or full URL in production
  var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  var API_BASE_URL = isLocalhost ? '' : 'https://dmhoa-246713e0bd92.herokuapp.com';
  const DEFAULT_IMAGE = './images/ns-img-443.png';

  function formatDate(dateString) {
    const date = new Date(dateString);
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    return day + '.' + month + '.' + year;
  }

  function createBlogCard(post, index) {
    var imageUrl = post.image_url || DEFAULT_IMAGE;
    var category = post.category || 'HOA News';
    var categoryDisplay = category.replace(/-/g, ' ').replace(/\b\w/g, function(l) { return l.toUpperCase(); });

    return '<article class="group">' +
      '<div class="bg-background-1 dark:bg-background-5 rounded-[20px] overflow-hidden">' +
        '<figure class="xl:min-h-[310px] xl:max-h-[310px] overflow-hidden">' +
          '<img src="' + imageUrl + '" alt="' + (post.title || '') + '" class="size-full object-cover group-hover:scale-105 ease-linear duration-300" onerror="this.src=\'' + DEFAULT_IMAGE + '\'" />' +
        '</figure>' +
        '<div class="p-4 md:p-6 lg:p-8 space-y-3">' +
          '<span class="inline-block px-4 py-1.5 bg-emerald-500/20 text-emerald-400 rounded-full text-tagline-2 font-medium">' + categoryDisplay + '</span>' +
          '<p class="text-tagline-2 text-secondary/60 dark:text-primary-50/60">' + formatDate(post.published_at) + '</p>' +
          '<h3 class="text-heading-5 font-semibold">' +
            '<a href="./blog/post.html?slug=' + post.slug + '" class="text-secondary dark:text-primary-50 hover:text-emerald-500 transition-colors">' + post.title + '</a>' +
          '</h3>' +
          '<p class="text-body-2 text-secondary/60 dark:text-primary-50/60 line-clamp-2">' + (post.excerpt || '') + '</p>' +
          '<a href="./blog/post.html?slug=' + post.slug + '" class="group/btn inline-flex items-center gap-2 px-6 py-2.5 bg-emerald-500 text-white rounded-full font-medium hover:bg-emerald-600 transition-colors mt-4">' +
            'Read More' +
            '<svg class="w-4 h-4 group-hover/btn:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>' +
          '</a>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  function loadBlogPosts() {
    var container = document.getElementById('blog-posts-container');
    if (!container) {
      console.error('Blog container not found');
      return;
    }

    console.log('Loading blog posts...');

    fetch(API_BASE_URL + '/api/blog-posts?limit=10&offset=0')
      .then(function(response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(function(data) {
        console.log('Blog API response:', data);

        if (!data.posts || data.posts.length === 0) {
          container.innerHTML = '<p class="col-span-full text-center py-12 text-secondary/60 dark:text-primary-50/60">No blog posts found.</p>';
          return;
        }

        var html = '';
        for (var i = 0; i < data.posts.length; i++) {
          html += createBlogCard(data.posts[i], i);
        }

        container.innerHTML = html;
        console.log('Blog posts rendered:', data.posts.length);
      })
      .catch(function(error) {
        console.error('Error loading blog posts:', error);
        container.innerHTML = '<p class="col-span-full text-center py-12 text-secondary/60">Failed to load blog posts. <button onclick="loadBlogPosts()" class="underline">Try again</button></p>';
      });
  }

  // Make loadBlogPosts available globally
  window.loadBlogPosts = loadBlogPosts;

  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadBlogPosts);
  } else {
    loadBlogPosts();
  }
})();
</script>
