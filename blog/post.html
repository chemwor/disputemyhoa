    <Component src="../src/components/pages/ai-resume-builder/footer.htm" />

    <script>
    (function() {
      // Use relative path for Vite proxy during development, or full URL in production
      var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      var API_BASE_URL = isLocalhost ? '' : 'https://dmhoa-246713e0bd92.herokuapp.com';

      function getSlugFromUrl() {
        var params = new URLSearchParams(window.location.search);
        return params.get('slug');
      }

      function formatDate(dateString) {
        var date = new Date(dateString);
        var day = String(date.getDate()).padStart(2, '0');
        var month = String(date.getMonth() + 1).padStart(2, '0');
        var year = date.getFullYear();
        return day + '.' + month + '.' + year;
      }

      function formatCategory(category) {
        if (!category) return 'HOA News';
        return category.replace(/-/g, ' ').replace(/\b\w/g, function(l) { return l.toUpperCase(); });
      }

      function parseContent(markdown) {
        if (!markdown) return '';
        var html = markdown;

        // Headers
        html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        html = html.replace(/^# (.*$)/gim, '<h2>$1</h2>');

        // Bold and italic
        html = html.replace(/\*\*\*(.*?)\*\*\*/gim, '<strong><em>$1</em></strong>');
        html = html.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/gim, '<em>$1</em>');

        // Unordered lists
        html = html.replace(/^\s*[-*]\s+(.*)$/gim, '<li>$1</li>');
        html = html.replace(/(<li>.*<\/li>\n?)+/gim, '<ul>$&</ul>');

        // Paragraphs
        html = html.replace(/^(?!<[hulo]|<li)(.*\S.*)$/gim, '<p>$1</p>');

        // Clean up
        html = html.replace(/\n\n+/g, '\n');

        return html;
      }

      function createError(message) {
        return '<div class="text-center py-12">' +
          '<h2 class="text-heading-3 text-white mb-4">Article Not Found</h2>' +
          '<p class="text-white/60 mb-8">' + message + '</p>' +
          '<a href="../blog.html" class="inline-flex items-center gap-2 px-6 py-3 bg-emerald-500 text-white rounded-full font-medium hover:bg-emerald-600 transition-colors">Back to Blog</a>' +
        '</div>';
      }

      function renderPost(post) {
        var container = document.getElementById('blog-post-content');
        var ctaBox = document.getElementById('blog-cta');

        // Update page title and meta
        document.title = (post.seo_title || post.title) + ' — Dispute My HOA';
        var metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute('content', post.seo_description || post.excerpt || '');

        var content = parseContent(post.content);

        var html = '<header class="mb-12">' +
          '<span class="inline-block px-4 py-1.5 bg-emerald-500/20 text-emerald-400 rounded-full text-tagline-2 font-medium mb-4">' + formatCategory(post.category) + '</span>' +
          '<h1 class="text-heading-2 md:text-display-4 font-semibold text-white mb-4">' + post.title + '</h1>' +
          (post.excerpt ? '<p class="text-body-1 text-white/60 mb-6">' + post.excerpt + '</p>' : '') +
          '<div class="flex items-center gap-4 text-tagline-2 text-white/40">' +
            '<span>By ' + (post.author || 'DisputeMyHOA Team') + '</span>' +
            '<span>&bull;</span>' +
            '<span>' + formatDate(post.published_at) + '</span>' +
            '<span>&bull;</span>' +
            '<span>' + (post.read_time_minutes || 5) + ' min read</span>' +
          '</div>' +
        '</header>';

        if (post.image_url) {
          html += '<figure class="mb-12 rounded-2xl overflow-hidden">' +
            '<img src="' + post.image_url + '" alt="' + (post.image_alt || post.title) + '" class="w-full h-auto object-cover">' +
          '</figure>';
        }

        html += '<div class="blog-content">' + content + '</div>';

        if (post.tags && post.tags.length > 0) {
          html += '<div class="mt-12 pt-8 border-t border-white/10">' +
            '<h3 class="text-heading-6 text-white mb-4">Tags</h3>' +
            '<div class="flex flex-wrap gap-2">' +
            post.tags.map(function(tag) {
              return '<a href="../blog.html?category=' + encodeURIComponent(tag) + '" class="px-3 py-1 bg-white/5 border border-white/10 rounded-full text-white/60 text-sm hover:bg-white/10 transition-colors">' + tag + '</a>';
            }).join('') +
            '</div></div>';
        }

        container.innerHTML = html;
        ctaBox.classList.remove('hidden');
      }

      function loadBlogPost() {
        var slug = getSlugFromUrl();
        var container = document.getElementById('blog-post-content');

        if (!slug) {
          container.innerHTML = createError('No article specified. Please select an article from the blog.');
          return;
        }

        console.log('Loading blog post:', slug);

        fetch(API_BASE_URL + '/api/blog-post/' + slug)
          .then(function(response) {
            if (response.status === 404) {
              throw new Error('not_found');
            }
            if (!response.ok) {
              throw new Error('HTTP ' + response.status);
            }
            return response.json();
          })
          .then(function(post) {
            console.log('Blog post loaded:', post.title);
            renderPost(post);
          })
          .catch(function(error) {
            console.error('Error loading blog post:', error);
            if (error.message === 'not_found') {
              container.innerHTML = createError('The article you are looking for does not exist or has been removed.');
            } else {
              container.innerHTML = createError('Failed to load article. Please try again later.');
            }
          });
      }

      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadBlogPost);
      } else {
        loadBlogPost();
      }
    })();
    </script>
  </body>
