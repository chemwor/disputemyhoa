[build]
# Directory to change to before starting a build
base = "."

# Directory that contains the deploy-ready HTML files and assets generated by the build
publish = "dist"

# Build command to run
command = "npm run build"

[build.environment]
# Node.js version for the build
NODE_VERSION = "18"

# Email click-tracking redirects: /r/<short_id> proxies to the Heroku
# backend, which logs the click and 302s to the real destination. Rule
# order matters — this MUST come before the SPA catch-all below.
[[redirects]]
from = "/r/*"
to = "https://dmhoa-246713e0bd92.herokuapp.com/r/:splat"
status = 200
force = true

# Redirect rules for SPA-like behavior (optional)
[[redirects]]
from = "/*"
to = "/index.html"
status = 404

# Custom headers for better performance
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
